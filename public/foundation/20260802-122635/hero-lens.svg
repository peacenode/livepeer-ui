<svg class="pointer-events-none absolute inset-0 h-full w-full" viewBox="0 0 158 100" preserveAspectRatio="none" aria-hidden="true"><defs><pattern id="lensHatch" width="1.6" height="1.6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="1.6" stroke="rgba(255,255,255,0.32)" stroke-width="0.35"></line></pattern><radialGradient id="lensGlowA" cx="79" cy="50" r="24" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="rgba(30, 153, 96, 0.36)"></stop><stop offset="45%" stop-color="rgba(24, 121, 78, 0.13)"></stop><stop offset="100%" stop-color="rgba(24, 121, 78, 0)"></stop></radialGradient><radialGradient id="lensGlowB" cx="90" cy="50" r="16" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="rgba(37, 171, 208, 0.32)"></stop><stop offset="55%" stop-color="rgba(20, 106, 143, 0.13)"></stop><stop offset="100%" stop-color="rgba(20, 106, 143, 0)"></stop></radialGradient><clipPath id="clipLeftCircle"><circle cx="50" cy="50" r="48.2"></circle></clipPath><clipPath id="clipRightCircle"><circle cx="108" cy="50" r="48.2"></circle></clipPath></defs><g clip-path="url(#clipLeftCircle)"><g clip-path="url(#clipRightCircle)"><rect x="0" y="0" width="158" height="100" fill="url(#lensGlowA)" style="animation:lensGlowABreathe 7.5s ease-in-out infinite;transform-origin:79px 50px"></rect><rect x="0" y="0" width="158" height="100" fill="url(#lensGlowB)" style="animation:lensGlowBDrift 9.5s ease-in-out infinite;transform-origin:79px 50px;mix-blend-mode:screen"></rect><rect x="0" y="0" width="158" height="100" fill="url(#lensHatch)"></rect></g></g><style>
        @keyframes lensGlowABreathe {
          0%, 100% { opacity: 0.55; transform: scale(0.9); }
          50%      { opacity: 1;    transform: scale(1.08); }
        }
        @keyframes lensGlowBDrift {
          0%, 100% {
            opacity: 0.4;
            transform: translate(-6px, 4px) scale(0.95);
          }
          33% {
            opacity: 0.95;
            transform: translate(5px, -3px) scale(1.1);
          }
          66% {
            opacity: 0.7;
            transform: translate(-2px, -5px) scale(1);
          }
        }
        @media (prefers-reduced-motion: reduce) {
          rect[style*="animation"] { animation: none !important; }
        }
      </style></svg>